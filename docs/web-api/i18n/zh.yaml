# Chinese (zh) translation overlay for docs/api/swagger.yaml.
#
# This file is merged onto the master spec by scripts/build_specs.py at
# build time to produce public/swagger.zh.json. Anything NOT translated
# here falls back to the English text — but every operation's summary
# and description MUST be translated: scripts/build_specs.py fails (and
# CI with it) when an operation or tag is missing, so a swagger.yaml
# change in a PR forces the matching zh update in the same PR.
#
# Per-operation keys:
#   summary, description            — required
#   parameters: <name>:             — optional, {description, example}
#   responses: <status>:            — optional, {description}
#   requestBody: {description}      — optional
info:
  title: NeoRuntime 平台 API
  description: |-
    AIPC 平台 REST API，面向边缘 AI 计算平台。

    提供统一访问：

    - AI 运行时（模型管理与推理）
    - 事件总线（发布/订阅消息）
    - 设备控制（摄像头、PTZ、GPIO）
    - 应用管理（容器生命周期）
    - 视频流（H264 视频流）
    - 错误语义（所有接口）：校验失败返回 HTTP 400，响应信封为
      {code: 1001, message: "Invalid request", error: {detail}}；
      缺失、无效或已吊销的 Bearer 令牌返回 HTTP 401 与 code 2000。
      下方各操作仅记录成功响应；即使未逐一标注，400/401 错误行为
      同样适用于每个写接口。

tags:
  System:
    name: 系统
    description: 系统信息与健康状态
  AI Runtime:
    name: AI 运行时
    description: 模型管理与推理
  Event Bus:
    name: 事件总线
    description: 发布/订阅事件消息
  Device Control:
    name: 设备控制
    description: 摄像头与设备控制
  App Manager:
    name: 应用管理
    description: 容器应用生命周期
  Stream:
    name: 视频流
    description: 视频流传输
  Settings:
    name: 设置
    description: 动态系统配置（键值存储）
  Monitor:
    name: 监控
    description: 系统资源监控（CPU、内存、磁盘、网络）
  Processes:
    name: 进程
    description: 系统进程管理
  Files:
    name: 文件
    description: 远程文件管理
  Terminal:
    name: 终端
    description: 网页终端访问
  SSH:
    name: SSH
    description: SSH 服务配置
  Logs:
    name: 日志
    description: 系统与服务日志查看
  Storage:
    name: 存储
    description: 磁盘操作与热插拔支持
  Media:
    name: 媒体
    description: 摄像头与媒体配置
  Event Logs:
    name: 事件日志
    description: 事件日志的管理与查询
  Debug Logs:
    name: 调试日志
    description: 调试日志导出与服务日志访问
  Network:
    name: 网络
    description: 网络接口配置（DHCP、静态 IP）
  Device Info:
    name: 设备信息
    description: 设备信息与命名
  Store:
    name: 应用商店
    description: 发现并安装应用的应用商店
  Dev:
    name: 开发工作台
    description: 应用开发工作台
  Containers:
    name: 容器
    description: 容器管理（containerd）
  Images:
    name: 镜像
    description: 容器镜像管理

paths:
  /system/info:
    get:
      summary: 获取系统信息
      description: 返回平台版本与各平台服务（ai-runtime、event-bus、device-control、app-manager）的可用性标志
  /system/stats:
    get:
      summary: 获取系统统计信息
      description: 返回系统与各服务的实时统计
  /system/health:
    get:
      summary: 健康检查
      description: 返回服务健康状态（无需认证）
  /system/password:
    post:
      summary: 修改后台登录密码
      description: 修改用于登录 Web 后台的密码。
  /system/restart:
    post:
      summary: 触发系统重启
      description: 触发整机重启。
  /system/ota/detect:
    get:
      summary: 检测新的 OTA 固件更新
      description: 检查是否存在待安装的新固件版本。
  /system/ota/install:
    post:
      summary: 上传并安装新固件包
      description: |-
        先解析固件包（兼容性检查仅供参考），随后执行部署。不兼容的包会在
        validate 阶段失败（状态为 failed）——parse 接口可提前给出同样的判定结果。
  /login:
    post:
      summary: 认证并获取 API 令牌
      description: |-
        远程调用者注意事项：(1) 完整路径为 /api/login——没有 /v1 段；
        (2) 返回的 token 字符串已自带 "Bearer " 前缀——请原样放入
        Authorization 请求头（Authorization: Bearer eyJ...）；
        (3) JWT 签名密钥在每次启动时重新生成，设备重启后令牌即失效——
        重启后需要重新登录。
  /logout:
    post:
      summary: 吊销当前 API 令牌
      description: 吊销本次请求所使用的 Bearer 令牌（服务端吊销）。
  /auth/public-key:
    get:
      summary: 获取设备 RSA 公钥
      description: |-
        PEM 格式公钥，供客户端在登录时加密密码字段。无需认证——在会话令牌
        存在之前就要获取它。
  /system/ota/status:
    get:
      summary: 获取 OTA 升级状态
      description: 特意设为公开（无需会话认证），升级进行期间可从全新客户端轮询安装进度。
  /system/ota/parse:
    post:
      summary: 解析固件文件但不安装
      description: 上传固件文件并查看其中的版本信息。
  /system/ota/install-from-path:
    post:
      summary: 从本地路径安装 OTA 固件
      description: 从设备本地文件路径安装 OTA 固件包。
  /system/os-upgrade/upload:
    post:
      summary: 流式上传 SWUpdate OS 包到持久存储
      description: 以流式方式将 OS 升级包写入持久存储。
  /system/os-upgrade/validate:
    post:
      summary: 校验已上传的 OS 包
      description: 校验已上传 OS 包的完整性与兼容性。
  /system/os-upgrade/install:
    post:
      summary: 开始写入非活动 OS 副本
      description: 开始将 OS 包写入非活动（inactive）分区副本。
  /system/os-upgrade/status:
    get:
      summary: 获取持久化的 OS 升级状态与日志尾部
      description: 特意设为公开（无需会话认证），与 OTA 状态接口一致。
  /system/os-upgrade/reboot:
    post:
      summary: 重启进入新安装的 OS 副本
      description: 重启并切换到新安装的 OS 副本。
  /system/os-upgrade/cancel:
    post:
      summary: 在安装前取消任务
      description: 在安装开始之前取消 OS 升级任务。
  /system/os-upgrade/package:
    delete:
      summary: 删除已存储的 OS 升级包
      description: 删除保存在持久存储中的 OS 升级包。
  /system/time/sync-from-client:
    post:
      summary: 依据客户端时间戳同步设备时钟
      description: 使用客户端的 Unix epoch 秒设置设备时钟；在可测量时补偿请求传输时延。
  /system/time:
    get:
      summary: 获取当前系统时间
      description: 返回设备当前系统时间。
  /system/time/set:
    post:
      summary: 手动设置系统时间
      description: 手动设置设备系统时间。
  /system/time/config:
    get:
      summary: 获取时间配置（NTP 设置）
      description: 返回时区与 NTP 相关配置。
    put:
      summary: 保存时间配置（时区）
      description: 将时区持久化写入设备时间配置。
  /system/time/timezone:
    put:
      summary: 设置时区
      description: 设置设备时区。
  /system/time/ntp:
    put:
      summary: 配置 NTP 设置
      description: 配置 NTP 服务器与开关。
  /system/time/ntp/sync:
    post:
      summary: 触发 NTP 时间同步
      description: 立即触发一次 NTP 时间同步。
  /system/time/timezones:
    get:
      summary: 列出可用时区
      description: 返回设备支持的时区列表。
  /config/jobs:
    get:
      summary: 列出配置控制器应用任务
      description: 只读审计配置 apply/delete/reconcile 任务历史。
  /config/jobs/{id}:
    get:
      summary: 按 ID 获取单个配置任务
      description: 按 ID 返回一条配置任务详情。

  /ai/capabilities:
    get:
      summary: 获取支持的模型格式与类型
      description: 返回 AI 运行时支持的模型格式（HEF/ONNX/TFLite 等）与模型类型。
  /ai/models/parse:
    post:
      summary: 解析上传的模型文件
      description: 上传模型文件（multipart 字段 "model"）并返回解析出的元数据（HEF 网络/输入信息），不加载模型。
  /ai/models/scan:
    post:
      summary: 重新扫描磁盘上的模型文件
      description: 从磁盘模型目录种子化/刷新模型注册表。
  /ai/models/{model_id}/load:
    post:
      summary: 将模型加载进 AI 运行时
      description: 加载指定模型，使其可用于推理。
  /ai/models/{model_id}/unload:
    post:
      summary: 从 AI 运行时卸载模型
      description: 卸载指定模型，释放运行时资源。
  /ai/models:
    get:
      summary: 列出所有已注册模型
      description: 返回模型注册表中的全部模型。
    post:
      summary: 注册新模型
      description: 通过指定模型文件路径注册模型。
  /ai/models/upload:
    post:
      summary: 上传并注册模型文件
      description: 上传模型文件（HEF、ONNX、TFLite）并注册。
  /ai/models/{model_id}:
    get:
      summary: 获取模型信息
      description: 返回指定模型的详细信息。
    delete:
      summary: 注销模型
      description: 从注册表中移除指定模型。
  /ai/models/{model_id}/apps:
    get:
      summary: 获取使用某模型的应用
      description: 返回正在使用该模型的应用列表。
  /ai/stats:
    get:
      summary: 获取 AI 运行时统计信息
      description: 返回 AI 运行时（NPU 等）的统计信息。

  /events/topics:
    get:
      summary: 列出所有事件主题
      description: 返回事件总线的全部主题。
  /events/publish:
    post:
      summary: 发布事件
      description: 向事件总线发布一条事件。
  /events/stream:
    get:
      summary: 订阅事件流（WebSocket）
      description: |-
        用于实时事件订阅的 WebSocket 端点。

        远程（nginx TLS）：`wss://{host}/api/v1/events/stream?token={jwt_token}`；
        设备本地：`ws://localhost:8080/api/v1/events/stream?token={jwt_token}`。

  /device/status:
    get:
      summary: 获取设备状态
      description: 返回受控设备/外设的当前状态。
  /device/light:
    post:
      summary: 设置白光灯亮度
      description: 设置补光灯亮度等级。
  /device/ir-led:
    post:
      summary: 控制红外补光灯
      description: 开启/关闭或调节红外 LED。
  /device/ir-cut:
    post:
      summary: 设置 IR-CUT 滤光片模式
      description: 切换 IR-CUT 滤光片（白天/夜间模式）。
  /device/ptz:
    post:
      summary: 控制 PTZ（云台）
      description: 控制云台的水平/垂直转动与变焦。
  /device/zoom:
    post:
      summary: 控制变焦
      description: 调节镜头变焦。
  /device/focus:
    post:
      summary: 控制对焦
      description: 调节镜头对焦。
  /device/autofocus:
    post:
      summary: 启用/禁用自动对焦
      description: 开启或关闭自动对焦。
  /device/gpio:
    get:
      summary: 批量读取 GPIO 值
      description: 一次调用读取多个 GPIO 引脚。不带 pins 参数时返回带实时值的完整引脚目录。
    post:
      summary: 写入 GPIO 值
      description: 写单个 GPIO 引脚的值。
  /device/gpio/{pin}:
    get:
      summary: 读取 GPIO 值
      description: 读取单个 GPIO 引脚的值。
  /device/lens/status:
    get:
      summary: 获取镜头电机状态
      description: 变焦/对焦电机状态、位置、光圈 ADC 及已配置的行程限位。
  /device/lens/oneshot-af:
    post:
      summary: 触发单次自动对焦
      description: 启动一次单次自动对焦流程。
  /device/lens/af/oneshot:
    post:
      summary: 触发单次自动对焦（别名）
      description: /device/lens/oneshot-af 的别名。
  /device/lens/zoom-follow:
    post:
      summary: 在指定变焦倍率下启动对焦跟随
      description: 将对焦跟踪锁定到给定光学变焦倍率（必须大于 0）。
  /device/lens/af/status:
    get:
      summary: 获取自动对焦任务状态
      description: 富的单次 AF 状态——状态机、进度、最佳对焦度量、置信度、可重复性、估计距离与位置。
  /device/lens/af/cancel:
    post:
      summary: 取消正在运行的自动对焦任务
      description: 取消当前自动对焦任务。
  /device/lens/zoom-level:
    put:
      summary: 将变焦移动到归一化等级
      description: 将变焦移动到 0-1 归一化等级。
  /device/lens/focus-level:
    put:
      summary: 将对焦移动到归一化等级
      description: 将对焦移动到 0-1 归一化等级。
  /device/lens/reset-zero:
    post:
      summary: 重置镜头电机零点
      description: 重新校准变焦和/或对焦电机零点（长耗时操作，最长 120 秒）。
  /device/lens/iris:
    post:
      summary: 驱动光圈电机
      description: 直接驱动光圈电机。
  /device/lens/iris-target:
    post:
      summary: 设置光圈目标 ADC 值
      description: 设置光圈闭环的目标 ADC 值。
  /device/lens/limits:
    put:
      summary: 设置变焦/对焦行程限位
      description: 设置变焦与对焦电机的行程限位。
  /device/lens/init:
    post:
      summary: 以已配置限位初始化镜头
      description: 使用 device-control.yaml 中的限位初始化镜头；无需请求体。
  /device/lens/goto:
    post:
      summary: 将镜头定位到指定变焦倍率与对焦距离
      description: 高层 AF0832 定位——例如 zoom_ratio 2.0、focus_distance_m 5.0。
  /device/fan:
    get:
      summary: 获取风扇状态
      description: 返回风扇当前状态。
    post:
      summary: 启用/禁用风扇
      description: 开启或关闭风扇。
  /device/heat:
    get:
      summary: 获取加热器状态
      description: 返回加热器当前状态。
    post:
      summary: 启用/禁用加热器
      description: 开启或关闭加热器。
  /device/radar:
    get:
      summary: 获取雷达状态
      description: 返回雷达当前状态。
    post:
      summary: 启用/禁用雷达
      description: 开启或关闭雷达。
  /device/alarm-out:
    post:
      summary: 设置告警输出通道状态
      description: 设置指定告警输出通道的状态。
  /device/alarm-out/{channel}:
    get:
      summary: 获取告警输出通道状态
      description: 返回指定告警输出通道的状态。
  /device/wiegand:
    post:
      summary: 设置韦根输出通道状态
      description: 设置指定韦根（wiegand）输出通道的状态。
  /device/wiegand/{channel}:
    get:
      summary: 获取韦根输出通道状态
      description: 返回指定韦根输出通道的状态。
  /device/alarm-outputs:
    get:
      summary: 获取全部告警/韦根输出状态
      description: 一次返回所有告警与韦根输出通道的状态。
  /device/rs485/init:
    post:
      summary: 初始化 RS485 总线
      description: 按给定参数初始化 RS485 总线。
  /device/rs485/deinit:
    post:
      summary: 反初始化 RS485 总线
      description: 释放 RS485 总线。
  /device/rs485/tx:
    post:
      summary: 通过 RS485 发送数据
      description: 向 RS485 总线发送一段数据。
  /device/capabilities:
    get:
      summary: 获取设备硬件能力
      description: 标识当前硬件变体所支持能力的特性开关。

  /apps:
    get:
      summary: 列出所有应用
      description: 返回已安装的全部应用。
    post:
      summary: 安装应用
      description: 安装一个应用。
  /apps/{app_id}:
    get:
      summary: 获取应用信息
      description: 返回指定应用的详细信息。
    delete:
      summary: 卸载应用
      description: 卸载指定应用。
  /apps/{app_id}/start:
    post:
      summary: 启动应用
      description: 启动指定应用。
  /apps/{app_id}/stop:
    post:
      summary: 停止应用
      description: 停止指定应用。
  /apps/{app_id}/stats:
    get:
      summary: 获取应用统计信息
      description: 返回指定应用的资源统计。
  /apps/{app_id}/logs:
    get:
      summary: 获取应用日志
      description: 返回指定应用的日志。
  /apps/{app_id}/permissions:
    get:
      summary: 获取应用权限
      description: 返回授予某应用的权限列表。
  /apps/wizard:
    post:
      summary: 通过向导安装应用
      description: 按向导流程安装应用。
  /apps/upload-image:
    post:
      summary: 上传容器镜像
      description: 上传应用容器镜像。
  /apps/upload-manifest:
    post:
      summary: 上传应用清单
      description: 上传 YAML 应用清单（multipart 字段 "file"，仅支持 .yaml/.yml），供后续打包安装使用。
  /apps/install-package:
    post:
      summary: 从已上传的清单与镜像安装应用
      description: 异步安装——返回 task_id，进度通过 /apps/install-progress/{task_id} 查询。
  /apps/install-progress/{task_id}:
    get:
      summary: 获取异步安装进度
      description: 返回指定安装任务的进度。
  /containers/{id}/logs/ws:
    get:
      summary: 通过 WebSocket 实时流式获取容器日志
      description: 实时推送容器日志的 WebSocket 端点。
  /containers/{id}/exec/ws:
    get:
      summary: 通过 WebSocket 交互式容器控制台
      description: 附加到容器交互式控制台的 WebSocket 端点。
  /apps/{app_id}/restart:
    post:
      summary: 重启应用
      description: 重启指定应用。

  /h264/{stream_id}:
    get:
      summary: 订阅 H264 视频流（WebSocket）
      description: |-
        零延迟 H264 视频流的 WebSocket 端点。
        远程（nginx TLS）：`wss://{host}/api/v1/h264/{stream_id}`；
        设备本地：`ws://localhost:8080/api/v1/h264/{stream_id}`。

  /settings:
    get:
      summary: 获取全部设置
      description: 返回键值存储中的所有设置项。
    post:
      summary: 创建或更新设置项
      description: 创建或更新一个设置项。
  /settings/{key}:
    delete:
      summary: 删除设置项
      description: 删除指定键的设置项。

  /monitor/summary:
    get:
      summary: 获取系统资源摘要
      description: 一次调用返回 CPU、内存、磁盘、网络与主机信息。
  /monitor/cpu:
    get:
      summary: 获取 CPU 使用详情
      description: 返回 CPU 使用率详情。
  /monitor/memory:
    get:
      summary: 获取内存与交换分区使用
      description: 返回内存及 swap 使用情况。
  /monitor/disk:
    get:
      summary: 获取磁盘分区使用
      description: 返回各磁盘分区的使用情况。
  /monitor/network:
    get:
      summary: 获取网络 I/O 计数
      description: 返回网络接口收发计数器。
